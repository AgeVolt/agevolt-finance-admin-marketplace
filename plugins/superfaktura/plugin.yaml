id: superfaktura
display_name: "SuperFaktura"
status: active-mvp
purpose: "SuperFaktura cez AgeVolt MCP pre oddelene klientske a dodavatelske finance/admin workflowy: ponuky, objednavky, faktury, dodacie listy, dodavatelske objednavky, nakladove faktury a bezpecne preview/write operacie."
skills:
  - id: superfaktura-client-side
    status: active-mvp
  - id: superfaktura-supplier-side
    status: active-mvp
kb:
  - superfaktura-client-documents.md
  - superfaktura-supplier-documents.md
  - superfaktura-mcp.md
mcp:
  - id: agevolt-superfaktura
    type: http
    url: "https://documents.agevolt.com/mcp/superfaktura/mcp"
rules:
  require_preview_before_write: true
  require_explicit_confirmation_before_execute: true
  execute_accepts_only_confirmation_id: true
  separate_client_and_supplier_skills: true
  use_mcp_tools_directly: true
  do_not_call_http_fallback_endpoints: true
  do_not_copy_customer_data_to_git: true
